[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cn-localgov-spread"
version = "4.0.0"
description = "Advanced Econometric Framework for China Local Government Bond Spread Analysis"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Quinn Liu", email = "quinn@quinnmacro.com"}
]
maintainers = [
    {name = "Quinn Liu", email = "quinn@quinnmacro.com"}
]
keywords = ["fixed-income", "bond-spread", "econometrics", "risk-management", "china-bonds"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Mathematics",
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.11.0",
    "statsmodels>=0.14.0",
    "arch>=6.0.0",
    "scikit-learn>=1.3.0",
    "plotly>=5.15.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "streamlit>=1.30.0",
    "hmmlearn>=0.3.0",
]

[project.optional-dependencies]
ml = [
    "xgboost>=2.0.0",
    "tensorflow>=2.15.0",
]
wind = [
    "WindPy>=1.0.0",
]
reports = [
    "openpyxl>=3.1.0",
    "python-pptx>=0.6.0",
    "reportlab>=4.0.0",
    "jinja2>=3.1.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "black>=23.0.0",
]
all = [
    "cn-localgov-spread[ml,reports,dev]",
]

[project.urls]
Homepage = "https://quinnmacro.com"
Repository = "https://github.com/quinnmacro/CNLocalGovSpread"
Documentation = "https://docs.quinnmacro.com/cn-localgov-spread"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "dashboard*"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["B", "C4"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "arch.*",
    "statsmodels.*",
    "scipy.*",
    "plotly.*",
    "streamlit.*",
]
ignore_missing_imports = true

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "validation: marks algorithm validation tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]
