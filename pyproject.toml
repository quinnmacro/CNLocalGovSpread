[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[project]
name = "cn-localgov-spread"
version = "4.0.0"
description = "Advanced Econometric Framework for China Local Government Bond Spread Analysis"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Quinn Liu", email = "quinn@quinnmacro.com"}
]
keywords = ["fixed-income", "bond-spread", "econometrics", "risk-management", "china-bonds"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Mathematics",
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.11.0",
    "statsmodels>=0.14.0",
    "arch>=7.0.0",
    "scikit-learn>=1.3.0",
    "plotly>=5.18.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "hmmlearn>=0.3.0",
    "dash>=2.14.0",
    "dash-bootstrap-components>=1.5.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
]

[project.optional-dependencies]
ml = [
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
]
wind = [
    "WindPy>=1.0.0",
]
reports = [
    "openpyxl>=3.1.0",
    "jinja2>=3.1.0",
    "weasyprint>=60.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
    "pandas-stubs>=2.0.0",
]
all = [
    "cn-localgov-spread[ml,reports,dev]",
]

[project.urls]
Homepage = "https://quinnmacro.com"
Repository = "https://github.com/quinnmacro/CNLocalGovSpread"


[project.scripts]
cls-dashboard = "dashboard.app:run_server"
cls-api = "api.app:run_server"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "TCH"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["B"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
strict_optional = true

[[tool.mypy.overrides]]
module = ["arch.*", "statsmodels.*", "scipy.*", "plotly.*", "hmmlearn.*", "dash.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = ["-v", "--tb=short", "--strict-markers"]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "validation: marks algorithm validation tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]
